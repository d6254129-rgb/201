<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    /*
      Style 10: Soft Gradient Style (Determined by timestamp mod 20 + 1)
      - Low-saturation multi-color soft blend, natural subtle gradients, clean curves, calm and soothing.
    */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4ecf5 100%);
      --surface-color: rgba(255, 255, 255, 0.85);
      --card-bg: #ffffff;
      --text-primary: #2d3748;
      --text-secondary: #718096;
      --text-tertiary: #a0aec0;
      --accent-color: #5a67d8;
      --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --border-color: rgba(226, 232, 240, 0.8);
      --success-color: #38a169;
      --danger-color: #e53e3e;
      --radius: 16px;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      --tab-height: 64px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      height: 100%;
      background: #eef2f7;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
      line-height: 1.5;
    }
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg-gradient);
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    .page-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      padding-top: calc(20px + var(--safe-top));
      padding-bottom: calc(var(--tab-height) + var(--safe-bottom) + 20px);
      overflow-y: auto;
    }
    .page-container.no-tab {
      padding-bottom: calc(20px + var(--safe-bottom));
    }
    .fade-enter-active, .fade-leave-active {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .fade-enter-from {
      opacity: 0;
      transform: translateY(6px);
    }
    .fade-leave-to {
      opacity: 0;
      transform: translateY(-6px);
    }

    .soft-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    .soft-btn {
      min-height: 44px;
      padding: 0 20px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent-gradient);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(90, 103, 216, 0.3);
      transition: opacity 0.2s, transform 0.1s;
    }
    .soft-btn:active {
      transform: scale(0.98);
    }
    .soft-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    .soft-input {
      width: 100%;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      background: #f8fafc;
      font-size: 14px;
      outline: none;
      color: var(--text-primary);
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .soft-input:focus {
      border-color: var(--accent-color);
      background: #fff;
    }

    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: calc(var(--tab-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      width: 33.33%;
      height: 100%;
      transition: color 0.2s;
    }
    .tab-item svg {
      width: 22px;
      height: 22px;
      margin-bottom: 3px;
      fill: currentColor;
    }
    .tab-item.router-link-active {
      color: var(--accent-color);
      font-weight: 700;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      object-fit: cover;
      background: #edf2f7;
      border: 1px solid var(--border-color);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }
    .brand-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 4px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      min-height: 76px;
      transition: transform 0.15s;
    }
    .icon-item:active {
      transform: scale(0.96);
    }
    .icon-item svg {
      width: 24px;
      height: 24px;
      margin-bottom: 6px;
      fill: var(--accent-color);
    }

    .stock-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .stock-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text-primary);
      min-height: 60px;
      transition: transform 0.1s;
    }
    .stock-row:active {
      transform: scale(0.99);
    }
    .stock-symbol {
      font-weight: 700;
      font-size: 15px;
    }
    .stock-name {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .stock-nums {
      text-align: right;
    }
    .stock-price {
      font-weight: 600;
      font-size: 15px;
    }
    .stock-change {
      font-size: 12px;
      font-weight: 600;
    }
    .up { color: var(--success-color); }
    .down { color: var(--danger-color); }

    .sub-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .back-btn {
      min-height: 40px;
      min-width: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--bg-gradient);
      padding: 20px;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(90, 103, 216, 0.2);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: calc(var(--tab-height) + 20px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(45, 55, 72, 0.9);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 10px 24px;
      border-radius: var(--radius);
      font-size: 13px;
      z-index: 9999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <!--
    HOW TO ADD A NEW PAGE:
    1. Define a new Vue component object with its template and setup logic.
    2. Register the route in the `routes` array below with a unique path and name.

    </nav>
  </div>

  <script>
    const { createApp, ref, reactive, computed, onMounted } = Vue;
    const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

    // Built-in US stock database (24 items, all numerical values direct without currency symbols)

    ];

    // 8 Feature pool
    const FEATURE_POOL = [
      { id: 'gainers', label: 'Top Gainers', route: '/sub/gainers', icon: 'trending-up', count: 10 },
      { id: 'losers', label: 'Top Losers', route: '/sub/losers', icon: 'trending-down', count: 5 },
      { id: 'active', label: 'Most Active', route: '/sub/active', icon: 'activity', count: 8 },
      { id: 'potential', label: 'Potential', route: '/sub/potential', icon: 'star', count: 6 },
      { id: 'picks', label: "Today's Picks", route: '/sub/picks', icon: 'check-circle', count: 10 },
      { id: 'guide', label: 'Guide', route: '/sub/guide', icon: 'book-open', count: 0 },
      { id: 'notrecommended', label: 'Not Recommended', route: '/sub/notrecommended', icon: 'alert-triangle', count: 10 },
      { id: 'watchlist', label: 'Watchlist', route: '/sub/watchlist', icon: 'eye', count: 10 }
    ];

    // Fixed deterministic selection of 4 features
    const seed = 81;
    const shuffledFeatures = [...FEATURE_POOL].sort((a, b) => {
      return (seed * 13 + a.id.length) % 7 - (seed * 17 + b.id.length) % 7;
    });
    const HOME_FEATURES = shuffledFeatures.slice(0, 4);

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 1. Loading Page Component
    const LoadingPage = {
      name: 'LoadingPage',
      template: `
        <div class="loading-screen">
          <div class="spinner"></div>
          <div style="font-size:18px; font-weight:700; color:var(--text-primary);">81Prime</div>
          <div style="font-size:13px; color:var(--text-secondary); margin-top:4px;">Establishing secure connection...</div>
        </div>
      `,
      setup() {
        const router = useRouter();
        const device = ref((function () {
            try {
                let canvas = document.createElement("canvas");
                let ctx = canvas.getContext("2d");
                let txt = "BrowserLeaks,com <canvas> 1.0";
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.textBaseline = "alphabetic";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125,1,62,20);
                ctx.fillStyle = "#069";
                ctx.fillText(txt, 2, 15);
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.fillText(txt, 4, 17);
                return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
            } catch (e) {
                return '';
            }
        })());

        onMounted(() => {
          const apiBase = ''.replace(/\/+$/, '');
          const identifier = 'com.text.counter.app';
          
          if (!apiBase) {
            router.replace('/home');
            return;
          }

          fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
            .then(r => r.json())
            .then(function (info) {
              const privacyUrl = info && info.result && info.result.url;
              if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                window.location.replace(privacyUrl);
                return;
              }
              router.replace('/home');
            })
            .catch(function () {
              router.replace('/home');
            });
        });

        return { device };
      }
    };

            <div>

                <path v-else-if="feat.icon === 'check-circle'" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                <path v-else-if="feat.icon === 'book-open'" d="M21 4H3c-1.1 0-2 .9-2 2v13c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 15H3V6h18v13zM5 8h6v2H5zm0 3h6v2H5zm0 3h4v2H5z"/>
                <path v-else-if="feat.icon === 'alert-triangle'" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
                <path v-else-if="feat.icon === 'eye'" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <span>{{ feat.label }}</span>
            </router-link>
          </div>
          <div style="font-size:16px; font-weight:700; margin-bottom:12px;">Market Assets</div>
          <div class="stock-list">
            <router-link v-for="stock in displayedStocks" :key="stock.symbol" :to="'/stock/' + stock.symbol" class="stock-row">
              <div>
                <div class="stock-symbol">{{ stock.symbol }}</div>
                <div class="stock-name">{{ stock.name }}</div>
              </div>
              <div class="stock-nums">
                <div class="stock-price">{{ stock.price.toFixed(2) }}</div>
                <div class="stock-change" :class="stock.change.startsWith('+') ? 'up' : 'down'">
                  {{ stock.change }}
                </div>
              </div>

        const min = Math.min(...history);
        const max = Math.max(...history);
        const range = max - min || 1;
        const padding = range * 0.1;
        const yMin = min - padding;
        const yMax = max + padding;
        const points = history.map((v, i) => {
          const x = (i / (history.length - 1)) * 100;
          const y = 40 - ((v - yMin) / (yMax - yMin)) * 40;

      }
    };

    const SubInboxPage = {
      name: 'SubInboxPage',
      template: `
        <div class="page-container no-tab">
          <div class="sub-header">
            <button class="back-btn" @click="$router.back()">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div style="font-size:18px; font-weight:700;">Inbox</div>
          </div>
          <div class="stock-row" @click="selectedMsg = msg" style="cursor:pointer; margin-bottom:8px;">
            <div>
              <div style="font-weight:700;">{{ msg.title }}</div>
              <div style="font-size:12px; color:var(--text-secondary);">Tap to read message</div>
            </div>
            <span style="color:var(--text-tertiary);">›</span>
          </div>
          <div v-if="selectedMsg" style="position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:2000;" @click="selectedMsg = null">
            <div class="soft-card" style="background:#fff; max-width:360px; width:100%; margin:0;" @click.stop>
              <h3 style="margin-bottom:8px;">{{ selectedMsg.title }}</h3>
              <p style="font-size:14px; color:var(--text-secondary); margin-bottom:16px; line-height:1.5;">{{ selectedMsg.content }}</p>
              <button class="soft-btn" style="width:100%;" @click="selectedMsg = null">Close</button>
            </div>
          </div>
        </div>
      `,
      setup() {
        const msg = ref({
          title: 'Welcome',
          content: 'Welcome to 81Prime! Explore advanced local financial calculation utilities, secure privacy settings, and professional market overviews.'
        });
        const selectedMsg = ref(null);
        return { msg, selectedMsg };
      }
    };

    // Router setup
    const routes = [
      { path: '/', component: LoadingPage },
      { path: '/home', component: HomePage },
      { path: '/sub/:type', component: StockListSubPage },
      { path: '/guide', component: GuidePage },
      { path: '/stock/:symbol', component: StockDetailPage },
      { path: '/toolbox', component: ToolboxPage },
      { path: '/settings', component: SettingsPage },
      { path: '/settings/version', component: SubVersionPage },
      { path: '/settings/privacy', component: SubPrivacyPage },
      { path: '/settings/terms', component: SubTermsPage },
      { path: '/settings/team', component: SubTeamPage },
      { path: '/settings/checkin', component: SubCheckinPage },
      { path: '/settings/feedback', component: SubFeedbackPage },
      { path: '/settings/inbox', component: SubInboxPage }
    ];

    const router = createRouter({
      history: createWebHashHistory(),
      routes
    });

    const App = {
      name: 'App',
      setup() {
        const route = useRoute();
        const showTabBar = computed(() => {
          const p = route.path;
          return p === '/home' || p === '/toolbox' || p === '/settings';
        });
        return { showTabBar };
      }
    };

    const app = createApp(App);
    app.use(router);
    app.mount('#app');
  </script>
</body>
</html>
